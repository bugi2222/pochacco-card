<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#100d21">
  <meta name="color-scheme" content="dark">
  <title>Pochacco · Маленькое чудо для тебя</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <main class="experience" aria-label="Интерактивная открытка с Почакко">
    <header class="heading"><h1>Маленькое чудо<span>для тебя</span></h1><div class="gold-rule" aria-hidden="true">✦</div></header>
    <section class="stage" id="stage" aria-label="Объёмная книжка-открытка">
      <div class="aura" aria-hidden="true"></div><div class="floor-shadow" aria-hidden="true"></div>
      <div class="book" id="book">
        <div class="back-board" aria-hidden="true"></div>
        <div id="leaves"></div>
        <div class="cover" id="cover">
          <div class="face cover-front"><img class="texture" src="assets/cover.png" alt="Фиолетовая обложка с золотым Почакко" fetchpriority="high"><button class="seal" id="seal" aria-label="Нажми на любую сторону обложки, чтобы открыть открытку" aria-expanded="false"><span class="seal-halo" aria-hidden="true"></span></button><span class="cover-sheen" aria-hidden="true"></span></div>
          <div class="face inside" id="coverInside"><img class="texture" src="assets/inside-left.png" alt=""><div class="left-caption"><span>С теплом,</span><b>Почакко</b><i>✦</i></div><div class="popup-half popup-left" data-popup="left-0" aria-hidden="true"><span class="join-marker"></span></div><div class="paper-tab tab-left" aria-hidden="true"></div></div>
          <div class="spine" aria-hidden="true"></div>
        </div>
        <div class="spine-light" aria-hidden="true"></div>
      </div>
      <span class="spark spark-a" aria-hidden="true">✦</span><span class="spark spark-b" aria-hidden="true">✧</span><span class="spark spark-c" aria-hidden="true">✦</span>
    </section>
    <p class="hint minimal-hint" id="hint" role="status">Коснись обложки</p>
    <section class="controls" hidden aria-label="Управление открыткой">
      <p class="message" id="message" hidden></p>
      <div class="page-nav" id="pageNav"><button id="previous" aria-label="Предыдущая страница">‹</button><div class="page-dots" id="pageDots" aria-label="Страницы"></div><button id="next" aria-label="Следующая страница">›</button></div>
      <button class="main-button" id="toggle">Открыть открытку <span aria-hidden="true">↗</span></button>
      <div class="small-controls"><button id="sound" aria-pressed="true">♪ Звук включён</button><span aria-hidden="true">·</span><button id="reset">Сначала</button></div>
    </section>
    <p class="asset-error" id="assetError" hidden>Не удалось загрузить графику. Проверь папку assets и перезапусти открытку.</p>
    <p class="sr-only" id="reading" aria-live="polite"></p>
    <p class="sr-only" id="pwaStatus" role="status"></p>
  </main>
  <audio id="openingAudio" src="assets/audio/opening.mp3" preload="auto" aria-hidden="true"></audio>
  <script src="math.js"></script><script src="app.js"></script><script src="pwa-client.js"></script>
</body>
</html>
